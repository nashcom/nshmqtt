# Full, standalone NGINX config demonstrating nshmqtt integration -- meant
# to replace /etc/nginx/nginx.conf entirely (see docker-compose.yml or run
# it directly), not to be dropped into conf.d/*.conf as a fragment.
#
# nshmqtt implements application semantics (event/metric/state handling).
# NGINX implements network exposure and transport security: HTTPS, client
# authentication, ACLs, rate limiting, request-size limits, access
# logging. Unlike nshgeoip's example (an auth_request subrequest feeding
# annotation back into a real request), this is a normal reverse proxy in
# front of nshmqtt's own HTTP API -- there is no subrequest indirection
# here, just proxy_pass straight through to the UNIX socket.
#
# Requires stock nginx (no special modules beyond what ships by default).

worker_processes auto;
worker_rlimit_nofile 4096;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # --- rate limiting -----------------------------------------------------
    # A basic per-client-IP limit on the write endpoints -- nshmqtt has no
    # rate limiting of its own by design (see README's security model);
    # this is the normal place for it. Adjust to your actual traffic.
    limit_req_zone $binary_remote_addr zone=nshmqtt_writes:10m rate=20r/s;

    # --- access log ----------------------------------------------------------
    log_format nshmqtt_log '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';

    server {
        # Plain HTTP for this example; put a real listen 443 ssl with your
        # own certificates (or a separate TLS-terminating proxy in front)
        # in an actual deployment. See README's Mosquitto/TLS section for
        # the equivalent stream{} pattern on the MQTT side.
        listen 8443;
        server_name example.invalid;

        access_log /var/log/nginx/access.log nshmqtt_log;

        # Bound request size at the edge too, ahead of nshmqtt's own
        # max_body_bytes -- belt and suspenders, and it means an
        # oversized request never reaches nshmqtt's socket at all.
        client_max_body_size 128k;

        # --- write endpoints: events and metrics --------------------------
        # Example client authentication -- replace with your own (mTLS via
        # ssl_verify_client, an upstream auth_request, an API-gateway JWT
        # check, ...). Basic auth shown here only because it needs no
        # extra NGINX modules to demonstrate end to end.
        location ~ ^/(event|metric)/ {
            auth_basic "nshmqtt";
            auth_basic_user_file /etc/nginx/nshmqtt.htpasswd;

            limit_req zone=nshmqtt_writes burst=40 nodelay;

            proxy_pass http://unix:/run/nshmqtt/nshmqtt.sock;
            proxy_http_version 1.1;
            # nshmqtt closes every connection itself (Connection: close on
            # every response, see http.cpp) -- this just tells NGINX not
            # to try reusing the upstream connection either.
            proxy_set_header Connection "close";

            # nshmqtt is local and answers fast (or fails fast -- see
            # mqtt_publish_timeout_seconds); a slightly generous read
            # timeout still beats stalling the client indefinitely.
            proxy_connect_timeout 500ms;
            proxy_read_timeout 10s;
        }

        # --- read-only endpoints ---------------------------------------------
        # /metrics-state carries actual payload data (current values of
        # everything ever published) -- the same auth as the write
        # endpoints above, not the lighter IP-only restriction below.
        # nshmqtt's own http_auth_tokens (X-Mqtt-Api-Key), if configured, is a
        # second, independent check on top of whatever NGINX does here --
        # neither one substitutes for the other, see README's "Security
        # considerations".
        location = /metrics-state {
            auth_basic "nshmqtt";
            auth_basic_user_file /etc/nginx/nshmqtt.htpasswd;

            proxy_pass http://unix:/run/nshmqtt/nshmqtt.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
        }

        # /metrics is service-only (request counters, MQTT connection
        # status, ...) -- no payload data, so a lighter IP-based
        # restriction to your monitoring network is enough here, not the
        # auth_basic above.
        location = /metrics {
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://unix:/run/nshmqtt/nshmqtt.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
        }

        location = /health {
            proxy_pass http://unix:/run/nshmqtt/nshmqtt.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
        }

        location / {
            return 404;
        }
    }
}
