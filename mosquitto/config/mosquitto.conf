# Mosquitto config for the docker-compose stack (docker-compose.yml).
# eclipse-mosquitto:2 refuses to start without an explicit listener +
# allow_anonymous decision -- this is the minimum needed for the stack to
# come up. allow_anonymous is fine for local development; add
# password_file/TLS for anything reachable beyond your own machine.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
