# Mosquitto config for the docker-compose stack (docker-compose.yml).
# eclipse-mosquitto:2 refuses to start without an explicit listener +
# allow_anonymous decision -- this is the minimum needed for the stack to
# come up. allow_anonymous is fine for local development; add
# password_file/TLS for anything reachable beyond your own machine.

listener 1883 0.0.0.0
allow_anonymous true

# WebSocket listener -- same broker, same topics, same allow_anonymous
# decision above (a listener-less setting applies broker-wide), just a
# different transport for clients that can't open a raw TCP socket
# (browser-based MQTT libraries: MQTT.js, Paho JS, ...). A WebSocket
# handshake is itself an HTTP request, so NGINX proxies to this the same
# way it proxies any other HTTP upgrade -- see nginx.conf.
listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

log_type all
connection_messages true
