name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Builds the actual Alpine/musl image (same one release.yml
      # publishes) and runs both the unit tests and integration_test.sh
      # inside a container from it -- the real libpaho-mqtt-c/libcurl
      # versions that ship, not a separately-built native Ubuntu/glibc
      # binary that could behave differently. See test-container.sh's own
      # comment; run it the same way locally to reproduce a CI failure.
      - name: Build image and run tests inside it
        run: ./test-container.sh
