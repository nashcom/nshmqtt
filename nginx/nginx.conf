# NGINX for the docker-compose stack -- the single published entry point
# for the core stack's HTTP write API (8080/8443), native MQTT
# (1883/8883), MQTT over WebSocket (9001/9002, for browser-based clients
# like MQTT.js that can't open a raw TCP socket), and Prometheus scraping
# (9100, its own dedicated listener, not a path on the API port -- see
# below). Grafana and
# Prometheus's own UIs are NOT here -- see nginx-monitoring.conf, a
# separate NGINX container that only exists at all when the
# "monitoring" compose profile is active (see docker-compose.yml), the
# same profile Grafana and Prometheus themselves are behind; see that
# file's own top comment for why splitting it out mattered. TLS here is
# server-side only (no client certs/mTLS yet -- a separate, later
# step): run ./gen-cert.sh once from the project root to populate ./tls/
# with a local test CA and a leaf cert covering every TLS listener in
# both this file and nginx-monitoring.conf, then trust tls/ca.crt in
# whatever client connects (curl --cacert, mosquitto_pub/sub --cafile,
# ...). Not for production -- see gen-cert.sh's own comment.

# mosquitto and nshmqtt below are each reached through an `upstream{}`
# block with the `resolve` parameter (mainline NGINX since 1.27.3), not a
# bare hostname baked into `proxy_pass` (which NGINX would look up
# exactly once, at its own startup, and never again). NGINX instead
# re-resolves them periodically in the background, through the
# `resolver` directive below (Docker's own embedded DNS, 127.0.0.11) --
# worth it since either container can restart with a new IP on Docker's
# own network at any time, with or without traffic flowing. Both are
# core, always-running services (no compose profile), so there's no
# "backend doesn't exist yet" case to worry about here. mosquitto gets
# two separate upstream{} blocks, not one -- `stream{}`'s own upstream
# namespace (for native MQTT) and `http{}`'s (for MQTT-over-WebSocket,
# below) are two different proxy engines with no shared state between
# them, even for the same backend.

# Reaches nshmqtt two different ways, deliberately split by concern, not
# just by URL path: the write API and /health go over its UNIX socket (a
# named volume shared between the nshmqtt and nginx containers, mounted
# at /run/nshmqtt in both -- see docker-compose.yml), the same way
# examples/nginx-nshmqtt.conf's bare-metal config does and matching
# nshmqtt's own documented primary interface (README's "Architecture");
# /metrics and /metrics-state go over nshmqtt's TCP listener instead, on
# 9100 internally (nshmqtt:9100 on the compose network) -- and this
# nginx.conf's own :9100 listener (below) is deliberately the *only*
# place either path is reachable from, not also available on 8080/8443.
# nshmqtt itself doesn't enforce any of this -- both of its own listeners
# answer the identical full route table -- it's nginx's own server/
# location blocks below doing the actual separation.

# Nothing here is published to the host directly except through nginx's
# own listeners -- NGINX is the only TLS termination point and the only
# thing any of it is reachable through, same as examples/nginx-nshmqtt.conf's
# stream{} pattern for a remote broker, just applied to inbound clients here.

worker_processes auto;

events {
    worker_connections 1024;
}

# Layer 4 (TCP) passthrough for native MQTT clients -- no HTTP involved,
# so this is a separate top-level block from http{} below, not a location
# inside it (NGINX's stream module doesn't nest inside http{}).

stream {
    resolver 127.0.0.11 valid=10s;

    upstream mosquitto {
        # zone: required alongside `resolve` -- the periodically-refreshed
        # server list lives in shared memory so every worker process sees
        # the same, current state, not each its own stale copy.

        zone mosquitto 64k;
        server mosquitto:1883 resolve;
    }

    server {
        listen 1883;
        listen 8883 ssl;
        # Same cert/key pair the http{} server below uses -- one leaf,
        # covers both listeners (see gen-cert.sh). ssl_certificate/
        # ssl_certificate_key are simply ignored by the plain :1883
        # listener above; NGINX only applies them where `ssl` is present.

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        proxy_pass mosquitto;
        # MQTT keepalive pings can be minutes apart; NGINX's own default
        # proxy_timeout (10m) already covers that, called out here as a
        # reminder should broker-side keepalive ever be tuned past it.

        proxy_timeout 10m;
    }
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    resolver 127.0.0.11 valid=10s;

    limit_req_zone $binary_remote_addr zone=nshmqtt_writes:10m rate=20r/s;

    log_format nshmqtt_log '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';

    # zone: required alongside `resolve` -- see the stream{} block's own
    # comment on why.

    upstream nshmqtt_metrics {
        zone nshmqtt_metrics 64k;
        server nshmqtt:9100 resolve;
    }

    upstream mosquitto_ws {
        zone mosquitto_ws 64k;
        server mosquitto:9001 resolve;
    }

    server {
        listen 8080;
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        access_log /var/log/nginx/access.log nshmqtt_log;
        client_max_body_size 128k;

        # No authentication yet -- add auth_basic (or your own mechanism,
        # see examples/nginx-nshmqtt.conf) here before exposing this
        # beyond your own machine/network.

        location ~ ^/(event|metric)/ {
            limit_req zone=nshmqtt_writes burst=40 nodelay;

            proxy_pass http://unix:/run/nshmqtt/nshmqtt.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
            proxy_connect_timeout 500ms;
            proxy_read_timeout 10s;
        }

        # /metrics and /metrics-state are NOT here -- see the dedicated
        # :9100 server{} below. Keeping them off the general API port is
        # the point: metrics scraping and the write API are reachable
        # through genuinely different listeners, not just different paths
        # on the same one.

        location = /health {
            proxy_pass http://unix:/run/nshmqtt/nshmqtt.sock;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
        }

        location / {
            return 404;
        }
    }

    # Dedicated metrics listener -- the exporter-port convention
    # (node_exporter and friends are reached the same way: their own
    # port, no path prefix, no sharing with anything else). Only
    # /metrics and /metrics-state exist here; everything else 404s, same
    # as the general API port does for paths it doesn't recognize.

    server {
        listen 9100;
        server_name _;

        access_log /var/log/nginx/access.log nshmqtt_log;

        # /metrics-state carries actual payload content (current values
        # of everything published) -- no NGINX-side auth here yet (see
        # examples/nginx-nshmqtt.conf for an auth_basic example to adapt),
        # but nshmqtt's own http_auth_tokens (X-Mqtt-Api-Key), if configured,
        # still applies regardless of what NGINX does or doesn't check.

        location = /metrics-state {
            proxy_pass http://nshmqtt_metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
        }

        # /metrics is service-only (no payload content) -- see
        # prometheus/prometheus.yml, which scrapes both this and
        # /metrics-state as separate jobs, both against this same :9100
        # listener.

        location = /metrics {
            proxy_pass http://nshmqtt_metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
        }

        location / {
            return 404;
        }
    }

    # MQTT over WebSocket -- a genuinely different transport from
    # stream{}'s native-MQTT passthrough above, not just another path:
    # a WebSocket handshake is itself an HTTP request (an `Upgrade:
    # websocket` GET), so it has to be proxied at the HTTP layer, not
    # TCP passthrough. Same broker, same topics, same messages either
    # way -- this exists for clients that can't open a raw TCP socket at
    # all (browser-based MQTT libraries: MQTT.js, Paho JS, ...).

    server {
        listen 9001;
        listen 9002 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        access_log /var/log/nginx/access.log nshmqtt_log;

        location / {
            proxy_pass http://mosquitto_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # An MQTT session over this connection can sit idle between
            # keepalive pings for a while -- NGINX's own default
            # (60s) would close it long before that. Same 10m reasoning
            # as the native-MQTT stream{} proxy's own proxy_timeout above.

            proxy_read_timeout 10m;
            proxy_send_timeout 10m;
        }
    }
}
