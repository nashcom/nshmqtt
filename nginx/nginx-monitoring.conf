# Separate NGINX container, mounted only into the "monitoring" compose
# profile's own nginx-monitoring service (see docker-compose.yml) --
# deliberately not just more server{} blocks inside nginx.conf's own
# container. Grafana and Prometheus are themselves optional (that same
# profile), so this container's lifecycle is tied to theirs: compose
# starts and stops all three together, and this container simply
# doesn't exist at all when the profile isn't active -- nothing here to
# ever log a "backend not found" error into, unlike a single shared
# NGINX container trying to resolve hostnames that may not exist yet.
# TLS-only, deliberately no plain fallback: Grafana has a real login
# form, and there's no good reason to ever let that travel in
# plaintext. Uses the same cert/key pair as nginx.conf's own container --
# run ./gen-cert.sh once from the project root (see nginx.conf's own
# top comment).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    resolver 127.0.0.11 valid=10s;

    log_format nshmqtt_log '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';

    # zone: required alongside `resolve` on each -- NGINX re-resolves
    # periodically in the background so a Grafana/Prometheus container
    # restart (a new IP on Docker's own network) is picked up without
    # needing this container itself restarted.

    upstream grafana {
        zone grafana 64k;
        server grafana:3000 resolve;
    }

    upstream prometheus {
        zone prometheus 64k;
        server prometheus:9090 resolve;
    }

    server {
        listen 3443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        access_log /var/log/nginx/access.log nshmqtt_log;

        location / {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Grafana's own live-update UI features use a websocket
            # connection; without this upgrade dance they'd silently fail.

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Same reasoning as Grafana above -- TLS-only.

    server {
        listen 9444 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        access_log /var/log/nginx/access.log nshmqtt_log;

        location / {
            proxy_pass http://prometheus;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
